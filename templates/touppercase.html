{% extends "base.html" %}
{% block title %}Convert String to Uppercase{% endblock %}
{% block content %}
<section class="section">
  <div class="back-row"><a class="back-link" href="{{ url_for('works') }}">&larr; Back to Works</a></div>
  <h1>Convert String to Uppercase</h1>
  <p class="welcome">Type anything below and I'll turn it into capital letters.</p>
  <form method="post">
    <div><label for="inputString">Enter a string</label><input id="inputString" name="inputString" type="text" placeholder="Type here..." required></div>
    <button type="submit">Convert</button>
  </form>
  {% if result %}<p class="result" role="status">{{ result }}</p>{% endif %}
</section>
{% endblock %}
